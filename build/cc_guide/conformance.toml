# Claude Code guide conformance register.
#
# Links the guide's anchored sections to the repo's Claude Code artifact
# kinds, to the mechanical checks that enforce them, and to the exceptions the
# owner has recorded. Edited by hand, on the owner's decisions; no script
# writes it. build/check_conformance.py reads it with tomllib.
# Design: specs/completed/claude-code-guide-conformance.md (R2).
#
# Paraphrases here are in the repo's own words; no docs text is committed.
# Section IDs are the guide's anchors (drift spec R1.1). A kind's `globs` are
# matched with PurePath.full_match against the files git keeps, so `*` stays
# inside one path segment and every glob is anchored at the repo root.
# A [[check]]'s `kind` names one kind, or lists several when one check spans
# kinds. A [[check]]'s sections must be governed by its kinds, and an
# [[exception]]'s by the kinds of its artifacts (the lint's section-fit rule).

[guide]
path = 'specs/guides/claude-code-customization-guide.md'

# ---------------------------------------------------------------------------
# Kinds: which files each artifact kind covers, and which sections govern it.
# A glob may match nothing yet: drift's project-local skill and agent under
# .claude/ are listed before they exist.
# ---------------------------------------------------------------------------

[kinds.skill]
description = 'Agent Skills: a SKILL.md per directory, canonical under skills/.'
globs = ['skills/*/SKILL.md', '.claude/skills/*/SKILL.md']
sections = [
    'skills.overview', 'skills.locations', 'skills.frontmatter',
    'skills.description', 'skills.listing-budget',
    'skills.progressive-disclosure', 'skills.arguments', 'skills.iterating',
    'commands.overview', 'mechanisms.overview', 'lean.ceremony',
    'lean.expensive-ops', 'lean.model-routing', 'context.overview',
    'lean.session-hygiene', 'lean.caching',
]

[kinds.agent]
description = 'Subagent definitions: canonical agents/*.md and project-local .claude/agents/.'
globs = ['agents/*.md', '.claude/agents/*.md']
sections = [
    'subagents.overview', 'subagents.frontmatter', 'subagents.tools',
    'subagents.models', 'subagents.isolation', 'lean.model-routing',
    'mechanisms.overview', 'lean.expensive-ops', 'lean.ceremony',
]

[kinds.command]
description = 'Slash-command files; they take skill frontmatter.'
globs = ['commands/*.md']
sections = [
    'commands.overview', 'skills.frontmatter', 'skills.arguments',
    'skills.description', 'mechanisms.overview', 'skills.listing-budget',
]

[kinds.hook]
description = 'Hook scripts and the README that documents their wiring.'
globs = ['hooks/*.sh', 'hooks/*.py', 'hooks/README.md']
exclude = ['hooks/test_*.py']
sections = [
    'hooks.overview', 'hooks.events', 'hooks.exit-codes', 'hooks.handlers',
    'hooks.configuration', 'hooks.patterns', 'hooks.pitfalls',
    'mechanisms.overview', 'rules.settings',
]

[kinds.rule]
description = 'Rules files: the canonical rules/ templates and everything under the project .claude/rules/, nested rules and symlinked directories included.'
globs = ['rules/*.md', '.claude/rules/**']
sections = [
    'rules.rules-files', 'rules.hierarchy', 'mechanisms.overview',
    'lean.session-hygiene', 'context.overview',
]

[kinds.settings]
description = 'Project settings committed to the repo.'
globs = ['.claude/settings.json']
# lean.model-routing governs the settings file, except its TODO(owner)
# bullet, which is the owner's open question and binds nothing.
sections = [
    'rules.settings', 'hooks.configuration', 'lean.model-routing',
    'hooks.patterns', 'hooks.exit-codes', 'mechanisms.overview',
    'hooks.pitfalls',
]

[kinds.claude-md]
description = 'Always-loaded CLAUDE.md files.'
globs = ['CLAUDE.md', 'build/CLAUDE.md']
sections = [
    'rules.claude-md', 'rules.hierarchy', 'context.overview',
    'lean.session-hygiene', 'mechanisms.overview', 'subagents.isolation',
    'subagents.frontmatter',
]

[kinds.installer]
description = 'install.py, which places skills, agents and commands for each runtime.'
globs = ['install.py']
sections = ['skills.locations', 'subagents.overview', 'commands.overview']

[kinds.skill-bundle]
description = 'Every file kept under a skill directory: the SKILL.md plus its references, scripts and data.'
globs = ['skills/*/**', '.claude/skills/*/**']
sections = ['skills.locations', 'skills.progressive-disclosure']

# ---------------------------------------------------------------------------
# Sections that govern no repo file, each with its reason. Disjoint from the
# kinds' sections; together they cover every anchor.
# ---------------------------------------------------------------------------

[unmapped]
'rules.overview' = 'An empty intro.'
'lean.overview' = 'An empty intro.'
'rules.auto-memory' = 'Auto memory lives under ~/.claude/projects/, outside the repo.'
'lean.measure' = 'Governs how sessions are measured, not any file here.'
'lean.mcp' = 'The repo configures no MCP server.'
'reading.overview' = 'Pointers to the docs.'

# ---------------------------------------------------------------------------
# Mechanical checks only. `type` is fact or advice, by the drift spec's R8.5
# test: a fact is a line a docs page could confirm or refute. Values taken
# from the guide are named parameters, so a guide change is reviewed here and
# the lint's code changes only when a mechanism does.
# ---------------------------------------------------------------------------

# The guide puts the docs' size target at under 200 lines per CLAUDE.md file.
[[check]]
id = 'claude-md-size'
kind = 'claude-md'
sections = ['rules.claude-md']
type = 'advice'
rule = 'Each CLAUDE.md file stays under the docs size target.'
enforced_by = 'check_conformance'
limit = 200

# A rule without paths loads in every session. always_on lists the rules
# that must persist past compaction, which the same section says should drop
# paths instead; none does today.
[[check]]
id = 'rule-paths'
kind = 'rule'
sections = ['rules.rules-files']
type = 'advice'
rule = 'A rules file sets a non-empty paths list so it loads lazily, unless always_on lists it; a .claude/rules/ link, to a file or a directory, resolves inside the repo.'
enforced_by = 'check_conformance'
always_on = []

# The guide's Pattern 1 double-quotes the project-dir variable, so a path with
# spaces survives word splitting.
[[check]]
id = 'hook-dir-quoted'
kind = ['hook', 'settings']
sections = ['hooks.patterns']
type = 'advice'
rule = 'A hook command keeps $CLAUDE_PROJECT_DIR inside double quotes.'
enforced_by = 'check_conformance'

# A Stop hook that ignores stop_hook_active can block on a condition that
# never resolves, until the block cap stops it.
[[check]]
id = 'stop-hook-guard'
kind = ['hook', 'settings']
sections = ['hooks.exit-codes', 'hooks.patterns']
type = 'advice'
rule = 'A command wired to Stop runs a repo hook script that reads stop_hook_active, directly or through uv run or python.'
enforced_by = 'check_conformance'

# Both lists come from the guide's subagent frontmatter table.
[[check]]
id = 'agent-fields'
kind = 'agent'
sections = ['subagents.frontmatter']
type = 'fact'
rule = 'Agent frontmatter uses only documented fields, and model is an alias or a full claude- model ID.'
enforced_by = 'check_conformance'
fields = [
    'name', 'description', 'tools', 'disallowedTools', 'model', 'effort',
    'permissionMode', 'maxTurns', 'skills', 'mcpServers', 'hooks', 'memory',
    'background', 'isolation', 'omitClaudeMd', 'experimental', 'color',
    'initialPrompt',
]
models = ['sonnet', 'opus', 'haiku', 'fable', 'inherit']

# Reviewers get read-only tools; memory silently adds Read, Write and Edit.
# The marker is check_frontmatter.py's `## Read-only contract` heading.
[[check]]
id = 'readonly-agent-tools'
kind = 'agent'
sections = ['subagents.tools']
type = 'advice'
rule = 'A read-only agent sets a tools list without the editing tools, and sets no memory.'
enforced_by = 'check_conformance'
forbidden_tools = ['Write', 'Edit', 'NotebookEdit']

# On macOS, Linux and WSL, Grep and Glob are absent for an agent that also
# lists Bash; search then runs through the shell.
[[check]]
id = 'bash-search-tools'
kind = 'agent'
sections = ['subagents.tools']
type = 'fact'
rule = 'An agent that lists Bash lists neither Grep nor Glob.'
enforced_by = 'check_conformance'

# Rules build/check_frontmatter.py already enforces, recorded here without
# change so the register maps them to the guide. Portability Stage A owns
# that file.
[[check]]
id = 'command-manual-only'
kind = 'command'
sections = ['commands.overview']
type = 'advice'
rule = 'Commands set disable-model-invocation: true.'
enforced_by = 'check_frontmatter'

[[check]]
id = 'fork-only-context'
kind = 'skill'
sections = ['skills.frontmatter']
type = 'fact'
rule = 'context, when present, is fork.'
enforced_by = 'check_frontmatter'

[[check]]
id = 'no-haiku-skill-model'
kind = ['skill', 'command']
sections = ['skills.frontmatter']
type = 'fact'
rule = 'No skill or command sets a Haiku model, since auto mode ignores it.'
enforced_by = 'check_frontmatter'

[[check]]
id = 'known-agent-tools'
kind = 'agent'
sections = ['subagents.frontmatter']
type = 'fact'
rule = 'Agent tools come from a known set.'
enforced_by = 'check_frontmatter'

# check_frontmatter.py applies the same 1,024-character cap to agent
# descriptions, by analogy with the listing budget.
[[check]]
id = 'description-cap'
kind = 'skill'
sections = ['skills.description']
type = 'fact'
rule = 'Descriptions stay within the listing cap; the repo enforces the stricter 1,024-character Agent Skills cap.'
enforced_by = 'check_frontmatter'

# Compaction re-attaches only the first 5,000 tokens of an invoked skill, so
# the body should fit and its critical sections should open it. The token
# estimate is characters / chars_per_token, a rough gauge; headings is the
# critical-sounding words (matched whole, any case) that flag a heading.
[[check]]
id = 'compaction-window'
kind = 'skill'
sections = ['skills.progressive-disclosure']
type = 'advice'
rule = 'A SKILL.md body fits the compaction window, and no critical-sounding heading starts past it.'
enforced_by = 'check_conformance'
tokens = 5000
chars_per_token = 4
headings = ['STOP', 'Red Flags', 'Critical', 'Gotchas', 'Iron Law', 'Hard Gate', 'Warning']

# Pronouns are matched whole and in any case, outside quoted phrases and code
# spans. `us` is left out: it reads as the country in `US data`.
[[check]]
id = 'description-person'
kind = 'skill'
sections = ['skills.description']
type = 'advice'
rule = 'A description (with when_to_use) uses no first- or second-person pronoun outside quoted phrases.'
enforced_by = 'check_conformance'
pronouns = ['i', 'me', 'my', 'mine', 'we', 'our', 'ours', 'you', 'your', 'yours']

# A heuristic: the guide asks for concrete trigger phrases, and the repo's
# descriptions give them as quoted phrases or a Trigger on list.
[[check]]
id = 'trigger-phrase-presence'
kind = 'skill'
sections = ['skills.description']
type = 'advice'
rule = 'A description holds a quoted phrase or a Trigger on list (a heuristic for concrete trigger phrases).'
enforced_by = 'check_conformance'
markers = ['trigger on', 'triggers on', 'trigger when', 'triggers when']

# The guide gives a backslash-dollar escape and exempts no fenced code, so the
# check scans the whole body. Declared `arguments` names count as well.
[[check]]
id = 'substitution-hazard'
kind = 'skill'
sections = ['skills.arguments']
type = 'fact'
rule = 'A SKILL.md body has no unescaped $ARGUMENTS, $<digit>, ${CLAUDE_...} or declared $name, and no render-time shell command.'
enforced_by = 'check_conformance'

# Tier three loads a bundled file only when the body points at it. A file is
# named when another text file in its skill, tests aside, gives its file name
# or its directory with a trailing slash. exempt files need no naming; tests
# neither need it nor count as naming anything.
[[check]]
id = 'orphan-bundled-file'
kind = 'skill-bundle'
sections = ['skills.progressive-disclosure']
type = 'advice'
rule = 'A bundled file under a skill directory is named by a file in that skill.'
enforced_by = 'check_conformance'
exempt = ['SKILL.md', 'README.md', 'INSTALL.md']
tests = ['test_*', '*_test.py', 'conftest.py', 'tests/*']

# On a name collision the skill wins, so the command file would never run.
[[check]]
id = 'skill-command-name-collision'
kind = ['skill', 'command']
sections = ['commands.overview']
type = 'fact'
rule = 'No commands/*.md filename stem equals a skill directory name.'
enforced_by = 'check_conformance'

# fields is the guide's skill frontmatter table less `name` and `paths`, which
# a command does not take.
[[check]]
id = 'command-frontmatter-keys'
kind = 'command'
sections = ['commands.overview', 'skills.frontmatter']
type = 'fact'
rule = 'Command frontmatter keys are skill fields, never name or paths.'
enforced_by = 'check_conformance'
fields = [
    'description', 'when_to_use', 'argument-hint', 'arguments', 'allowed-tools',
    'disallowed-tools', 'model', 'effort', 'context', 'agent', 'background',
    'disable-model-invocation', 'user-invocable', 'hooks', 'shell', 'license',
    'compatibility', 'metadata',
]

# The three built-ins the guide names; a skill with a built-in's name replaces
# it in a local terminal session.
[[check]]
id = 'builtin-name-shadow'
kind = ['skill', 'command']
sections = ['commands.overview']
type = 'fact'
rule = 'No skill or command takes the name of a built-in command the guide names.'
enforced_by = 'check_conformance'
builtins = ['help', 'model', 'compact']

# ~/.claude/skills/synced/ holds skills synced from a claude.ai account.
[[check]]
id = 'reserved-skill-name'
kind = 'skill-bundle'
sections = ['skills.locations']
type = 'fact'
rule = 'No skill directory takes a name reserved for synced claude.ai skills.'
enforced_by = 'check_conformance'
reserved = ['synced']

# Plan 35 audit section 6 checks (/deferred pass 2026-10-05), agents and commands.

# The guide's subagent table calls the name a unique lowercase-hyphenated ID.
# allow lists the names a deviation exception covers: Explore overrides the
# built-in Explore agent only under that spelling.
[[check]]
id = 'agent-name-form'
kind = 'agent'
sections = ['subagents.frontmatter']
type = 'fact'
rule = 'An agent name is a lowercase-hyphenated ID, unless allow lists it.'
enforced_by = 'check_conformance'
allow = ['Explore']

# availableModels restricts every place a model can be named, and an agent's
# model field is one. A full claude- ID is not compared, and exempt lists the
# values that name no model.
[[check]]
id = 'agent-model-available'
kind = ['agent', 'settings']
sections = ['lean.model-routing']
type = 'fact'
rule = "An agent's model alias appears in availableModels in the project settings, when that key is set."
enforced_by = 'check_conformance'
exempt = ['inherit']

# A project agent beats a personal one of the same name, so a name that
# repeats across agents/ and .claude/agents/ hides one definition.
[[check]]
id = 'agent-name-unique'
kind = 'agent'
sections = ['subagents.frontmatter', 'subagents.overview']
type = 'fact'
rule = 'No agent name repeats across agents/ and .claude/agents/.'
enforced_by = 'check_conformance'

# $ARGUMENTS, $ARGUMENTS[n] and $n are substituted before Claude sees the
# body, and a render-time shell command is permission-checked, so the guide
# has the file pre-approve it in allowed-tools. A command declares the first
# with argument-hint or arguments, and the second with a Bash entry in
# allowed-tools. A $name is text unless arguments lists it, and the
# ${CLAUDE_*} built-ins need no declaration, so neither is checked.
[[check]]
id = 'command-substitution-tokens'
kind = 'command'
sections = ['skills.arguments']
type = 'fact'
rule = 'A command that uses $ARGUMENTS or $<digit> sets argument-hint or arguments, and one that runs render-time shell sets allowed-tools with a Bash entry.'
enforced_by = 'check_conformance'

# Plan 35 audit section 6 checks, hooks, rules and settings.

# A rule with paths loads lazily, so a path-scoped rule that calls itself
# always-on misdescribes how it loads. phrases are matched case-insensitively
# as plain text, and a phrase that follows not, never or n't is skipped.
[[check]]
id = 'rule-always-on-claim'
kind = 'rule'
sections = ['rules.rules-files']
type = 'fact'
rule = 'A rule that sets paths does not call itself always-on or every-session.'
enforced_by = 'check_conformance'
phrases = [
    'always-on', 'always on', 'every session', 'every turn', 'every edit',
    'every python edit',
]

# The guide's pitfalls bullet lets a hook block with exit 2 or a JSON deny.
[[check]]
id = 'hook-readme-exit-claims'
kind = 'hook'
sections = ['hooks.pitfalls', 'hooks.exit-codes']
type = 'fact'
rule = 'A hooks README that documents a permissionDecision deny does not say only exit 2 blocks.'
enforced_by = 'check_conformance'

# A script git cannot run fails open: the pitfalls section says a mistyped
# path or a crash lets the call through, and hooks/README.md names a missing
# execute bit. A tracked script is judged by its git index mode, an untracked
# one by its working-tree owner execute bit.
[[check]]
id = 'hook-scripts-executable'
kind = ['hook', 'settings']
sections = ['hooks.pitfalls']
type = 'advice'
rule = 'Every hook script has git index mode 100755, and every .sh or .py command a hooks tree wires names a script in hooks/.'
enforced_by = 'check_conformance'

# The guide keeps hook dependencies out of the project environment with
# single-file scripts that declare them inline. A script that imports only the
# standard library has none to declare; a PEP 723 block counts as declaring.
[[check]]
id = 'hook-python-deps'
kind = 'hook'
sections = ['hooks.pitfalls']
type = 'advice'
rule = 'Hook Python imports only the standard library, or carries a PEP 723 script block.'
enforced_by = 'check_conformance'

# Claude Code splits a compound command on its separators and an allow rule
# must match every part, so a rule that spells a separator never matches. Reads
# the committed settings file and the settings JSON in Markdown. The per-machine
# .claude/settings.local.json is gitignored, so the lint never reads it.
[[check]]
id = 'allow-rule-compound-operators'
kind = ['hook', 'settings']
sections = ['rules.settings']
type = 'fact'
rule = 'No allow rule holds an unquoted &&, ||, ;, |, |& or &.'
enforced_by = 'check_conformance'

# Auto mode sets broad runner rules aside. A runner rule is broad when it
# ends at the runner, or at :* or * after it.
[[check]]
id = 'inert-runner-allow-rules'
kind = 'hook'
sections = ['rules.settings']
type = 'fact'
rule = 'A README that offers a broad runner allow rule as sparing prompts names the permission mode where that holds.'
enforced_by = 'check_conformance'
runners = [
    'uv run', 'uvx', 'npm run', 'npx', 'pnpm run', 'yarn run', 'bun run',
    'poetry run', 'pipx run',
]

# The events whose rows in the guide's events table say exit 2 blocks.
[[check]]
id = 'hook-install-verify-step'
kind = 'hook'
sections = ['hooks.pitfalls']
type = 'advice'
rule = 'Install text that wires a blocking hook tells the reader to trigger it once, before the next heading.'
enforced_by = 'check_conformance'
blocking_events = [
    'PreToolUse', 'UserPromptSubmit', 'Stop', 'SubagentStop', 'PreCompact',
    'ConfigChange',
]

# Plan 35 audit section 6 checks, CLAUDE.md files.

# The guide's imports go at most 4 hops deep, and backticks escape one. The
# scan skips fenced blocks and inline code, so a mention in either is not an
# import, and a ~ or absolute target depends on the machine, so it is not followed.
[[check]]
id = 'claude-md-import-resolves'
kind = 'claude-md'
sections = ['rules.hierarchy']
type = 'fact'
rule = 'Each @ import in a CLAUDE.md file resolves to a file, within the guide hop limit.'
enforced_by = 'check_conformance'
max_hops = 4

# CLAUDE.local.md is personal and the guide leaves the gitignore line to you.
# The check asks git about the path beside each CLAUDE.md, so the file need
# not exist, and counts only a committed .gitignore, never a global or
# .git/info/exclude rule that lives on one machine.
[[check]]
id = 'local-md-ignored'
kind = 'claude-md'
sections = ['rules.hierarchy']
type = 'advice'
rule = 'CLAUDE.local.md, beside each CLAUDE.md, is ignored by a committed .gitignore.'
enforced_by = 'check_conformance'

# A count of tests, passes or skips is a fast-changing detail the guide says to
# leave out of CLAUDE.md, and one that no longer matches misleads. nouns are
# the words a number must precede to count; originals is the skill count that
# check_provenance.py and test_check_provenance.py pin against NOTICE, so allow
# exempts that note by its wording, without its number.
[[check]]
id = 'claude-md-count-claims'
kind = 'claude-md'
sections = ['rules.claude-md']
type = 'advice'
rule = 'A CLAUDE.md line does not state a test, pass, skip or similar count, unless allow exempts it.'
enforced_by = 'check_conformance'
nouns = [
    'test', 'tests', 'test functions', 'passed', 'passes', 'skipped', 'skips',
    'failed', 'failures', 'xfailed', 'originals',
]
allow = ['originals — keep in sync']

# The guide's Pattern 1 quotes the project-dir variable so a path with spaces
# survives word splitting; the same holds for any variable that starts a
# script path, $HOME included. $CLAUDE_PROJECT_DIR stays with hook-dir-quoted.
[[check]]
id = 'hook-var-quoted'
kind = ['hook', 'settings']
sections = ['hooks.patterns']
type = 'advice'
rule = 'A hook command keeps any other variable that starts a script path inside double quotes.'
enforced_by = 'check_conformance'

# ---------------------------------------------------------------------------
# Exceptions, decided by the owner at the plan 35 gate (2026-10-04) on the
# audit in specs/claude-code-conformance-audit-2026-10-04.md. A deviation is
# deliberate and names its revisit trigger; a gap is known non-conformance and
# names where its fix lands. A waiver (check set) lists explicit paths, and
# when its file stops violating, the lint fails until the entry is narrowed.
# ---------------------------------------------------------------------------

# All seven agents list Grep and Glob beside Bash (drift's known drift #1).
[[exception]]
id = 'grep-glob-beside-bash'
type = 'gap'
check = 'bash-search-tools'
sections = ['subagents.tools']
artifacts = [
    'agents/code-reviewer.md', 'agents/debugger.md', 'agents/docs-writer.md',
    'agents/explore.md', 'agents/security-auditor.md', 'agents/task-reviewer.md',
    'agents/test-runner.md',
]
guide = 'On macOS, Linux and WSL an agent that lists Bash gets no Grep or Glob.'
reason = 'The Gemini adapters map Grep and Glob to working tools, so deleting them from the canonical files would regress Gemini.'
evidence = 'Drift spec R11.5 #1; audit rows L-02 to L-08.'
protects = ['gemini']
tracked_in = 'drift Stage 3, first files batch (drift spec R11.5 #1)'

# hooks/README.md's install snippet leaves $CLAUDE_PROJECT_DIR unquoted
# three times (drift's known drift #3).
[[exception]]
id = 'hook-dir-unquoted'
type = 'gap'
check = 'hook-dir-quoted'
sections = ['hooks.patterns']
artifacts = ['hooks/README.md']
guide = 'A hook command keeps $CLAUDE_PROJECT_DIR in double quotes.'
reason = 'The README install snippet predates the quoted pattern.'
evidence = 'Drift spec R11.5 #3; audit rows L-09 to L-11.'
tracked_in = 'drift Stage 3, first files batch (drift spec R11.5 #3)'

# writing-skills keeps descriptions trigger-only on tested evidence.
[[exception]]
id = 'description-when-only'
type = 'deviation'
sections = ['skills.description']
artifacts = ['skills/*/SKILL.md']
guide = 'A description states what the skill does and when to use it.'
reason = 'writing-skills requires trigger-only Use when descriptions, on tested evidence that a workflow summary lets agents skip the body.'
evidence = 'writing-skills, Skill Discovery Optimization; portability spec Decision 4; audit rows S-28 to S-52 and S-54.'
revisit = 'When trigger-eval suites exist (a portability deferred item).'

# Other skills hand off to these by bare name. artifacts is seat S's list,
# less the four the owner split out as a gap (side-effecting-skills-ungated).
[[exception]]
id = 'side-effecting-skills-invocable'
type = 'deviation'
sections = ['commands.overview', 'skills.frontmatter']
artifacts = [
    'skills/finishing-a-development-branch/SKILL.md',
    'skills/using-git-worktrees/SKILL.md',
    'skills/brainstorming/SKILL.md',
    'skills/writing-plans/SKILL.md',
    'skills/executing-plans/SKILL.md',
    'skills/describe-critique-methodology/SKILL.md',
    'skills/llm-wiki/SKILL.md',
    'skills/derive-roadmap/SKILL.md',
]
guide = 'A side-effecting workflow sets disable-model-invocation: true.'
reason = 'Other skills hand off to these by bare name, which a manual-only skill cannot receive; their bodies gate the side effects, some only in part.'
evidence = 'Portability spec Decision 3; audit rows S-81 to S-87 and S-92.'
revisit = 'When the guide documents a way for one skill to hand off to a manual-only skill.'

# Side-effecting skills that Decision 3 does not cover.
[[exception]]
id = 'side-effecting-skills-ungated'
type = 'gap'
sections = ['commands.overview', 'skills.frontmatter']
